<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>超級管家</title>
<!-- 安裝到手機桌面用：圖示、全螢幕 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F3EA">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="超級管家">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 超級管家 App ===== */
  :root {
    --bg: #F7F3EA;
    --card: #FFFFFF;
    --ink: #1F2933;
    --muted: #6B7280;
    --line: #E5DFD2;
    --todo: #FFD1C4;
    --project: #CFE6FF;
    --daily: #D5F2D8;
    --once: #E8DDFB;
    --accent: #1F2933;
    --danger: #D64545;
    --warn: #E08A1E;
    --ok: #2E8B57;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px; line-height: 1.45;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* 頂部 */
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 14px 16px 0;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top h1 { font-size: 22px; font-weight: 900; margin: 0; letter-spacing: .5px; }
  .top .sub { font-size: 13px; color: var(--muted); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    border: 2px solid var(--ink); background: var(--card);
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 14px 0 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 4px; border-radius: 999px; justify-content: center;
    border: 2px solid var(--ink); background: var(--card);
    font-weight: 700; font-size: 15px; display: flex; gap: 4px; align-items: center; white-space: nowrap;
  }
  .tab .n { font-size: 12px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--bg); display: inline-grid; place-items: center; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tab[aria-selected="true"] .n { background: rgba(255,255,255,.2); }

  /* 列表 */
  main { padding: 4px 16px; }
  .card {
    background: var(--card); border: 2px solid var(--ink); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start;
    transition: opacity .25s, transform .25s;
  }
  .card.leaving { opacity: 0; transform: translateX(24px); }
  .check {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid var(--ink); margin-top: 1px;
    display: grid; place-items: center; background: var(--card);
  }
  .check svg { width: 16px; height: 16px; opacity: 0; }
  .check.done { background: var(--ok); border-color: var(--ok); }
  .check.done svg { opacity: 1; }
  .body { min-width: 0; }
  .title { font-weight: 700; font-size: 17px; word-break: break-word; }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge {
    font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--bg); border: 1.5px solid var(--line);
  }
  .badge.danger { background: #FDE8E8; border-color: #F5B5B5; color: var(--danger); }
  .badge.warn { background: #FFF1DE; border-color: #F6CF98; color: #9A5A00; }
  .badge.ok { background: #E6F4EC; border-color: #B7DEC6; color: var(--ok); }
  .chip {
    font-size: 13px; padding: 2px 8px; border-radius: 8px; background: var(--bg); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .more { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .more svg { width: 20px; height: 20px; }
  .type-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

  /* 新增按鈕 */
  .fab {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    height: 56px; border-radius: 16px; background: var(--ink); color: #fff;
    font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(31,41,51,.25); z-index: 6;
  }
  .fab svg { width: 22px; height: 22px; }

  /* 底部面板 */
  .scrim { position: fixed; inset: 0; background: rgba(31,41,51,.45); z-index: 20; display: none; }
  .scrim.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--bg); border-radius: 22px 22px 0 0; border-top: 2px solid var(--ink);
    padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .25s ease;
  }
  .sheet.show { transform: translateY(0); }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #CFC8B8; margin: 0 auto 12px; }
  .sheet h2 { font-size: 20px; font-weight: 900; margin: 0 0 14px; }
  .field { margin-bottom: 16px; }
  .field > label, .field > .lbl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .input {
    width: 100%; height: 48px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card);
    padding: 0 12px; font-size: 16px;
  }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button {
    height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); font-weight: 700;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:disabled { opacity: .35; }
  .times { display: flex; flex-wrap: wrap; gap: 8px; }
  .time-item { display: flex; align-items: center; gap: 2px; background: var(--card); border: 2px solid var(--ink);
    border-radius: 12px; padding: 0 4px 0 8px; height: 44px; }
  .time-item input { border: 0; background: transparent; width: 124px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .time-item button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .add-time { height: 44px; padding: 0 14px; border-radius: 12px; border: 2px dashed var(--ink); font-weight: 700; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .switch { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--ink); }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 6px; }
  .btn { height: 52px; border-radius: 14px; font-weight: 900; font-size: 17px; border: 2px solid var(--ink); background: var(--card); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .menu-list button {
    width: 100%; height: 54px; text-align: left; padding: 0 14px; border-radius: 14px; margin-bottom: 8px;
    background: var(--card); border: 2px solid var(--ink); font-weight: 700; font-size: 17px;
  }
  .menu-list button.danger { color: var(--danger); border-color: var(--danger); }
  .section-title { font-weight: 900; font-size: 16px; margin: 6px 0 8px; }

  /* 提示 */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30;
    background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    transform: translateY(20px); opacity: 0; pointer-events: none; transition: all .2s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast button { color: #FFD966; font-weight: 900; }
  .loading { text-align: center; padding: 60px 16px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink);
    animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .demo-bar { background: #FFE7A3; border-bottom: 2px solid var(--ink); font-size: 13px; text-align: center; padding: 6px 12px; font-weight: 700; }

  /* 個人／辦公室切換 */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 12px; background: var(--card);
    border: 2px solid var(--ink); border-radius: 14px; padding: 4px; }
  .modes button { height: 40px; border-radius: 10px; font-weight: 900; font-size: 16px; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .tabs.three { grid-template-columns: repeat(3, 1fr); }
  .tabs.five { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tabs.five .tab { font-size: 14px; padding: 8px 2px; gap: 2px; }
  .tabs.five .tab .n { min-width: 18px; padding: 0 4px; }
  .buy-rows { display: grid; gap: 8px; }
  .buy-row { display: grid; grid-template-columns: 1.4fr .8fr 1fr auto; gap: 6px; align-items: center; }
  .buy-row .input { height: 44px; padding: 0 8px; font-size: 15px; min-width: 0; }
  .buy-row button { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); }
  .add-row { height: 40px; padding: 0 14px; border-radius: 12px; border: 2px dashed var(--ink); font-weight: 700; justify-self: start; }
  .chip.link { cursor: pointer; background: #FFF1DE; }
  .seg.small button { height: 36px; font-size: 14px; }
  .contact-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 14px; }
  .contact-line .who { font-weight: 700; }
  .contact-line .tel { color: var(--muted); font-variant-numeric: tabular-nums; user-select: all; }
  .call { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 14px; border-radius: 999px;
    background: var(--ok); color: #fff; font-weight: 900; text-decoration: none; font-size: 14px; }
  .group-title { font-weight: 900; font-size: 15px; margin: 16px 2px 8px; display: flex; justify-content: space-between; }
  .group-title span { color: var(--muted); font-weight: 700; font-size: 13px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 2px dashed var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; background: var(--card); font-size: 15px; }
  .note { font-size: 13px; color: var(--muted); margin: 2px 2px 10px; }
  textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
  select.input { appearance: auto; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .history { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0 0 12px; }
  .history .d { font-size: 12px; color: var(--muted); }
  .history .r { font-weight: 700; }
  .confirm-text { font-size: 16px; margin: -4px 0 16px; color: var(--ink); }
  .card .body.tap { cursor: pointer; }
  [hidden] { display: none !important; }
  .new-contact { margin-top: 8px; display: grid; gap: 8px; }
</style>
</head>
<body>

<div id="demoBar" class="demo-bar" hidden>示範模式：資料只存在這個畫面，不會送到超級管家</div>

<header>
  <div class="top">
    <div>
      <h1>超級管家</h1>
      <div class="sub" id="today"></div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="提醒時間設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </div>
  <div class="modes" id="modes"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="list"><div class="loading"><div class="spinner"></div>載入中…</div></main>

<button class="fab" id="addBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="addLabel">新增</span>
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastAction" hidden>復原</button></div>

<script>
/* ======================= 設定 ======================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxbmnz9R-eJ1H4SnGerEPbqFNY4-d89jNUIkTb3sqjb7YSZe8fqMT66KPXjxG3nKxpl/exec'
};
/* ==================================================== */

const DEMO = !CONFIG.API_URL || new URLSearchParams(location.search).has('demo');
const PERSONAL_TABS = [
  { key: '待辦', label: '待辦' },
  { key: '專案', label: '專案' },
  { key: '每天', label: '每天' },
  { key: '一次', label: '單次' },
  { key: '個人購買', label: '待購買' }
];
const OFFICE_TABS = [
  { key: '辦公', label: '待辦' },
  { key: '辦公購買', label: '待購買' },
  { key: '聯絡人', label: '聯絡人' }
];
const REMINDER_TYPES = ['待辦', '專案', '每天', '一次', '辦公'];
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
let state = {
  mode: '個人',
  tab: { '個人': '待辦', '辦公室': '辦公' },
  items: [], supplies: [], contacts: [],
  defaults: { '待辦': ['09:00', '13:00', '18:00'], '專案': ['09:00', '17:00'], '辦公': ['09:00', '13:00', '18:00'] },
  supplyTime: '17:30',
  buyGroup: '店家',
  loaded: false
};
const curTab = () => state.tab[state.mode];
const BUY_TABS = { '個人購買': '個人', '辦公購買': '辦公室' };
const scopeOf = (x) => x.scope || '辦公室';
const needOf = (scope) => state.supplies.filter((x) => x.status === '缺' && scopeOf(x) === scope);
const projectOf = (id) => state.items.find((i) => i.id === id && i.type === '專案');

/* ---------- 工具 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ymdToUTC(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function daysBetween(a, b) { return Math.round((ymdToUTC(b) - ymdToUTC(a)) / 86400000); }
function prettyDate(s) {
  const w = WEEK[new Date(ymdToUTC(s)).getUTCDay()];
  const y = +s.slice(0, 4);
  return (y !== new Date().getFullYear() ? y + '/' : '') + (+s.slice(5, 7)) + '/' + (+s.slice(8, 10)) + '（' + w + '）';
}
const telHref = (p) => 'tel:' + String(p || '').replace(/[^0-9+#*]/g, '');
const contactOf = (id) => state.contacts.find((c) => c.id === id);

/** 每筆的剩餘時間標籤 */
function statusOf(it) {
  const today = todayStr();
  if (it.type === '待辦' || it.type === '辦公') {
    const left = daysBetween(today, it.dt.slice(0, 10));
    if (left < 0) return { text: '已過期 ' + (-left) + ' 天', cls: 'danger' };
    if (left === 0) return { text: '今天截止', cls: 'danger' };
    if (left <= 2) return { text: '剩 ' + left + ' 天', cls: 'warn' };
    return { text: '剩 ' + left + ' 天', cls: '' };
  }
  if (it.type === '專案') {
    const d = it.created ? daysBetween(it.created.slice(0, 10), today) : 0;
    return { text: '已進行 ' + d + ' 天', cls: '' };
  }
  if (it.type === '一次') {
    const t = new Date(it.dt.replace(' ', 'T') + ':00');
    const mins = Math.max(0, Math.round((t - new Date()) / 60000));
    const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    const text = '還有 ' + (d ? d + ' 天 ' : '') + (h ? h + ' 小時' : '') + (!d ? (h ? ' ' : '') + m + ' 分' : '');
    return { text, cls: mins < 60 ? 'warn' : '' };
  }
  return { text: '每天', cls: 'ok' };
}
function sortKey(it) {
  if (it.type === '待辦' || it.type === '辦公' || it.type === '一次') return it.dt;
  return (it.times[0] || '') + it.content;
}

/* ---------- 登入 ---------- */
/** 專屬鑰匙：從 LINE 的「打開超級管家」連結帶進來，存在這支手機上，之後不用再經過 LINE */
const KEY_NAME = 'sb_key';
function takeKeyFromLink() {
  const m = location.hash.match(/k=([0-9a-f]{64})/);
  if (!m) return;
  try { localStorage.setItem(KEY_NAME, m[1]); } catch (e) {}
  history.replaceState(null, '', location.pathname);
}
function appKey() {
  let k = null;
  try { k = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (!k) throw new Error('NO_KEY');
  return k;
}
function showNeedKey(msg) {
  state.loaded = true;
  $('list').innerHTML = '<div class="empty"><b>' + esc(msg || '還沒連結你的帳號') + '</b>' +
    '請到 LINE 的「超級管家」，按下面的「打開超級管家」，<br>會用瀏覽器打開你的專屬 App。<br><br>' +
    '打開之後就可以「安裝到桌面」，<br>以後直接點桌面圖示，不會再經過 LINE。</div>';
}

/* ---------- 和後端溝通 ---------- */
async function api(action, params) {
  if (DEMO) return demoApi(action, params || {});
  const key = appKey();
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, params: params || {}, key }) });
  const j = await res.json();
  if (!j.ok) {
    if (/連結失效/.test(j.error || '')) {
      try { localStorage.removeItem(KEY_NAME); } catch (e) {}
      throw new Error('NO_KEY');
    }
    throw new Error(j.error || '發生錯誤');
  }
  return j.data;
}

function apply(data) {
  state.items = data.items || [];
  state.supplies = data.supplies || [];
  state.contacts = data.contacts || [];
  state.defaults = Object.assign({}, state.defaults, data.defaults || {});
  if (data.supplyTime) state.supplyTime = data.supplyTime;
  state.loaded = true;
  render();
}

/** 呼叫後端；成功時顯示提示，給了 undo 就多一顆「復原」 */
async function run(action, params, okText, undo) {
  try {
    apply(await api(action, params));
    if (okText) toast(okText, undo);
    return true;
  } catch (e) {
    if (e.message === 'NO_KEY') { closeSheet(); showNeedKey('連結已失效'); return false; }
    toast('⚠️ ' + e.message);
    return false;
  }
}

/* ---------- 畫面 ---------- */
function render() {
  const d = new Date();
  const missing = needOf('辦公室').length;
  $('today').textContent = (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK[d.getDay()] + '）' +
    (state.mode === '個人'
      ? '共 ' + state.items.filter((i) => i.type !== '辦公').length + ' 件提醒'
      : '辦公待辦 ' + state.items.filter((i) => i.type === '辦公').length + ' 件・待買 ' + missing + ' 樣');

  $('modes').innerHTML = ['個人', '辦公室'].map((m) =>
    '<button data-mode="' + m + '" aria-pressed="' + (state.mode === m) + '">' + m + '</button>').join('');

  const tabs = state.mode === '個人' ? PERSONAL_TABS : OFFICE_TABS;
  $('tabs').className = 'tabs' + (tabs.length === 3 ? ' three' : tabs.length === 5 ? ' five' : '');
  $('tabs').innerHTML = tabs.map((t) => {
    const n = BUY_TABS[t.key] ? needOf(BUY_TABS[t.key]).length : t.key === '聯絡人' ? state.contacts.length : state.items.filter((i) => i.type === t.key).length;
    return '<button class="tab" role="tab" aria-selected="' + (curTab() === t.key) + '" data-tab="' + t.key + '">' +
      t.label + '<span class="n">' + n + '</span></button>';
  }).join('');

  const tab = curTab();
  $('addLabel').textContent = BUY_TABS[tab] ? '記下要買的' : tab === '聯絡人' ? '新增聯絡人' : '新增';
  if (!state.loaded) return;
  if (BUY_TABS[tab]) return renderSupplies(BUY_TABS[tab]);
  if (tab === '聯絡人') return renderContacts();
  renderReminders(tab);
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const MORE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

function renderReminders(tab) {
  const items = state.items.filter((i) => i.type === tab).sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
  const label = tab === '辦公' ? '辦公室待辦' : PERSONAL_TABS.find((t) => t.key === tab).label;
  if (!items.length) {
    $('list').innerHTML = '<div class="empty"><b>目前沒有' + label + '</b>按下面的「新增」加一筆</div>';
    return;
  }
  $('list').innerHTML = items.map((it) => {
    const st = statusOf(it);
    let when = '';
    if (it.type === '待辦' || it.type === '辦公') when = '<span class="chip">' + prettyDate(it.dt.slice(0, 10)) + '截止</span>';
    if (it.type === '一次') when = '<span class="chip">' + prettyDate(it.dt.slice(0, 10)) + ' ' + it.dt.slice(11) + '</span>';
    const times = it.type === '一次' ? '' : it.times.map((t) => '<span class="chip">⏰ ' + t + '</span>').join('');
    let contact = '';
    if (it.type === '辦公') {
      const c = contactOf(it.contactId);
      contact = c
        ? '<div class="contact-line">📞 <span class="who">' + esc(c.name) + '</span><span class="tel">' + esc(c.phone) + '</span>' +
          '<a class="call" href="' + telHref(c.phone) + '">撥打</a></div>'
        : '<div class="contact-line">🙋 自己處理</div>';
    }
    if (it.type === '專案') {
      const nb = state.supplies.filter((x) => x.status === '缺' && x.projectId === it.id).length;
      if (nb) when += '<span class="chip link" data-act="goBuy">🛒 待買 ' + nb + ' 樣</span>';
    }
    const canCheck = it.type !== '每天';
    return '<div class="card" data-id="' + esc(it.id) + '">' +
      (canCheck ? '<button class="check" data-act="done" aria-label="完成">' + CHECK_SVG + '</button>'
                : '<span class="check" style="border-style:dashed;opacity:.5"></span>') +
      '<div class="body"><div class="title">' + esc(it.content) + '</div>' +
      '<div class="meta"><span class="badge ' + st.cls + '">' + st.text + '</span>' + when + times + '</div>' + contact + '</div>' +
      '<button class="more" data-act="menu" aria-label="更多">' + MORE_SVG + '</button></div>';
  }).join('');
}

function renderSupplies(scope) {
  const need = needOf(scope);
  const usual = state.supplies.filter((x) => x.status === '買了' && scopeOf(x) === scope).sort((a, b) => a.name < b.name ? -1 : 1);
  const byProject = scope === '個人' && state.buyGroup === '專案';
  let html = '<div class="note">每天 ' + esc(state.supplyTime) + ' 還有沒買的，會在 LINE 提醒你</div>';
  if (scope === '個人') {
    html += '<div class="seg two small" style="margin-bottom:6px">' + ['店家', '專案'].map((g) =>
      '<button type="button" data-act="buyGroup" data-g="' + g + '" aria-pressed="' + (state.buyGroup === g) + '">依' + g + '</button>').join('') + '</div>';
  }
  if (!need.length) {
    html += '<div class="empty" style="padding:28px 16px"><b>目前沒有要買的 👍</b>按下面「記下要買的」加一筆' +
      (scope === '個人' ? '，或在專案裡列要買的東西' : '') + '</div>';
  } else {
    const groups = {};
    need.forEach((x) => {
      const p = projectOf(x.projectId);
      const k = byProject ? (p ? '📂 ' + p.content : '📝 沒有專案') : '🛒 ' + (x.store || '還沒決定去哪買');
      (groups[k] = groups[k] || []).push(x);
    });
    Object.keys(groups).sort().forEach((g) => {
      html += '<div class="group-title">' + esc(g) + '<span>' + groups[g].length + ' 樣</span></div>';
      html += groups[g].map((x) =>
        '<div class="card" data-sid="' + esc(x.id) + '">' +
        '<button class="check" data-act="bought" aria-label="買到了">' + CHECK_SVG + '</button>' +
        '<div class="body"><div class="title">' + esc(x.name) + '</div>' +
        '<div class="meta">' + (x.qty ? '<span class="chip">' + esc(x.qty) + '</span>' : '') +
          (byProject ? (x.store ? '<span class="chip">🛒 ' + esc(x.store) + '</span>' : '')
                     : (projectOf(x.projectId) ? '<span class="chip">📂 ' + esc(projectOf(x.projectId).content) + '</span>' : '')) + '</div></div>' +
        '<button class="more" data-act="supplyMenu" aria-label="更多">' + MORE_SVG + '</button></div>').join('');
    });
  }
  if (usual.length) {
    html += '<div class="group-title">常買的東西<span>缺了點一下加回去</span></div><div class="pill-row">' +
      usual.map((x) => '<button class="pill" data-act="readd" data-sid="' + esc(x.id) + '">＋ ' + esc(x.name) + '</button>').join('') + '</div>';
  }
  $('list').innerHTML = html;
}

function renderContacts() {
  const list = state.contacts.slice().sort((a, b) => a.name < b.name ? -1 : 1);
  if (!list.length) {
    $('list').innerHTML = '<div class="empty"><b>還沒有聯絡人</b>新增辦公室待辦時選「要聯絡人」，也會自動存進來</div>';
    return;
  }
  $('list').innerHTML = list.map((c) => {
    const n = (c.history || []).length;
    return '<div class="card" data-cid="' + esc(c.id) + '" style="grid-template-columns:1fr auto">' +
      '<div class="body tap" data-act="contactOpen"><div class="title">' + esc(c.name) + '</div>' +
      '<div class="meta"><span class="chip" style="user-select:all">' + esc(c.phone) + '</span>' +
      (n ? '<span class="badge">' + n + ' 筆聯絡紀錄</span>' : '') + '</div></div>' +

}

/* ---------- 底部面板 ---------- */
function openSheet(html) {
  $('toast').classList.remove('show');
  const stores = [...new Set(state.supplies.map((x) => x.store).filter(Boolean))];
  html += '<datalist id="sStoresAll">' + stores.map((n) => '<option value="' + esc(n) + '">').join('') + '</datalist>';
  $('sheetBody').innerHTML = html;
  $('scrim').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet() {
  $('scrim').classList.remove('show');
  $('sheet').classList.remove('show');
  if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(null); }
}

/** 確認視窗：按「取消」或點外面就不做；extra 可以多放輸入欄位 */
let confirmResolve = null;
function askConfirm(opt) {
  return new Promise((resolve) => {
    openSheet('<h2>' + esc(opt.title) + '</h2>' +
      (opt.text ? '<p class="confirm-text">' + esc(opt.text) + '</p>' : '') + (opt.extra || '') +
      '<div class="actions"><button type="button" class="btn" data-act="cfmNo">取消</button>' +
      '<button type="button" class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-act="cfmYes">' + esc(opt.ok) + '</button></div>');
    confirmResolve = resolve;
  });
}
function finishConfirm(yes) {
  const r = confirmResolve; confirmResolve = null;
  const result = $('cfmResult') ? $('cfmResult').value.trim() : '';
  $('scrim').classList.remove('show'); $('sheet').classList.remove('show');
  if (r) r(yes ? { result } : null);
}

function timesEditor(times) {
  return '<div class="times" id="timesBox">' + times.map(timeItem).join('') +
    '<button class="add-time" type="button" data-act="addTime">＋ 時間</button></div>';
}
function timeItem(t) {
  return '<span class="time-item"><input type="time" value="' + t + '" required>' +
    '<button type="button" data-act="rmTime" aria-label="移除">✕</button></span>';
}
function readTimes() { return [...document.querySelectorAll('#timesBox input')].map((i) => i.value).filter(Boolean); }
function tomorrowStr() { const t = new Date(Date.now() + 86400000); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }

function buyRow(x) {
  return '<div class="buy-row" data-sid="' + esc(x ? x.id : '') + '">' +
    '<input class="input b-name" maxlength="60" placeholder="要買什麼" value="' + esc(x ? x.name : '') + '">' +
    '<input class="input b-qty" maxlength="20" placeholder="數量" value="' + esc(x ? x.qty : '') + '">' +
    '<input class="input b-store" maxlength="40" list="sStoresAll" placeholder="去哪裡" value="' + esc(x ? x.store : '') + '">' +
    '<button type="button" data-act="rmBuy" aria-label="移除">✕</button></div>';
}
function readBuys() {
  return [...document.querySelectorAll('#buyRows .buy-row')].map((r) => ({
    id: r.dataset.sid, name: r.querySelector('.b-name').value.trim(), qty: r.querySelector('.b-qty').value.trim(), store: r.querySelector('.b-store').value.trim()
  })).filter((b) => b.name);
}

function updateFormType(type, resetTimes) {
  const form = $('form');
  form.dataset.type = type;
  form.querySelectorAll('[data-act="setType"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.type === type));
  form.querySelectorAll('[data-show]').forEach((el) => { el.hidden = !el.dataset.show.split(' ').includes(type); });
  if (resetTimes) {
    const box = $('timesBox');
    box.querySelectorAll('.time-item').forEach((n) => n.remove());
    const addBtn = box.querySelector('.add-time');
    (state.defaults[type] || ['08:00']).forEach((t) => addBtn.insertAdjacentHTML('beforebegin', timeItem(t)));
  }
  $('timesHint').textContent = type === '待辦' ? '截止前每天在這些時間提醒；過了截止日會繼續提醒到你完成'
    : type === '專案' ? '沒有期限，每天在這些時間提醒到你完成' : '每天固定在這些時間提醒';
}

async function submitOffice(e) {
  e.preventDefault();
  const form = $('officeForm');
  const id = form.dataset.id;
  const content = $('oContent').value.trim();
  if (!content) return toast('請填寫要做什麼');
  const times = readTimes();
  if (!times.length) return toast('請至少設定一個提醒時間');
  const p = { type: '辦公', content, deadline: $('oDeadline').value, times, contactId: '' };
  if (form.dataset.how === 'contact') {
    if ($('oContact').value === '__new') {
      const name = $('ncName').value.trim(), phone = $('ncPhone').value.trim();
      if (!name || !phone) return toast('請填聯絡人的名字和電話');
      p.newContact = { name, phone };
    } else {
      p.contactId = $('oContact').value;
    }
  }
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true; btn.textContent = '儲存中…';
  const ok = id ? await run('update', Object.assign({ id }, p), '已儲存') : await run('add', p, '已新增');
  btn.disabled = false; btn.textContent = id ? '儲存' : '新增';
  if (ok) closeSheet();
}

async function submitForm(e) {
  e.preventDefault();
  const form = $('form');
  const type = form.dataset.type;
  const id = form.dataset.id;
  const content = $('fContent').value.trim();
  if (!content) return toast('請填寫內容');
  const p = { type, content };
  if (type === '待辦') p.deadline = $('fDeadline').value;
  if (type === '一次') p.dt = $('fDate').value + ' ' + $('fTime').value;
  if (type !== '一次') {
    p.times = readTimes();
    if (!p.times.length) return toast('請至少設定一個提醒時間');
  }
  if (type === '專案') p.buys = readBuys();
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true; btn.textContent = '儲存中…';
  const ok = id ? await run('update', Object.assign({ id }, p), '已儲存') : await run('add', p, '已新增');
  btn.disabled = false; btn.textContent = id ? '儲存' : '新增';
  if (ok) { state.tab['個人'] = type; closeSheet(); render(); }
}

  openSheet(
    '<h2>' + (c ? '編輯聯絡人' : '新增聯絡人') + '</h2>' +

}

async function complete(id) {
  const item = state.items.find((i) => i.id === id);
  if (!item) return;
  const c = item.type === '辦公' ? contactOf(item.contactId) : null;
  const nb = item.type === '專案' ? state.supplies.filter((x) => x.status === '缺' && x.projectId === item.id).length : 0;
  const ans = await askConfirm({
    title: '完成這件事？', text: item.content + (nb ? '（還有 ' + nb + ' 樣沒買，會一起從待購買拿掉）' : ''), ok: '完成',
    extra: c ? '<div class="field"><label for="cfmResult">跟 ' + esc(c.name) + ' 聯絡的結果（可以不填）</label>' +
      '<textarea class="input" id="cfmResult" maxlength="300" placeholder="例如：說下週三前會付款"></textarea></div>' : ''
  });
  if (!ans) return;
  await run('complete', { id, result: ans.result }, '👍 已完成：' + item.content, () => run('restore', { id }, '已復原：' + item.content));
}

async function remove(id) {
  const item = state.items.find((i) => i.id === id);
  if (!item) return;
  const ans = await askConfirm({ title: '刪除這件事？', text: item.content, ok: '刪除', danger: true });
  if (!ans) return;
  await run('delete', { id }, '已刪除：' + item.content, () => run('restore', { id }, '已復原：' + item.content));
}

async function bought(sid) {
  const s = state.supplies.find((x) => x.id === sid);
  if (!s) return;
  const ans = await askConfirm({ title: '買到了嗎？', text: s.name + (s.qty ? '（' + s.qty + '）' : ''), ok: '買到了' });
  if (!ans) return;
  await run('supplyBought', { id: sid }, '👍 已買：' + s.name, () => run('supplyNeed', { id: sid, name: s.name, qty: s.qty, store: s.store, scope: scopeOf(s), projectId: s.projectId || '' }, '已放回清單：' + s.name));
}

async function supplyDelete(sid) {
  const s = state.supplies.find((x) => x.id === sid);
  if (!s) return;
  const ans = await askConfirm({ title: '刪除這一項？', text: s.name + '（刪除後不會出現在常買的東西）', ok: '刪除', danger: true });

async function contactDelete(cid) {

let toastTimer, toastUndo = null;
function toast(text, undo) {
  $('toastText').textContent = text;
  toastUndo = undo || null;
  $('toastAction').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').classList.remove('show'); toastUndo = null; }, undo ? 6000 : 2600);
}
$('toastAction').addEventListener('click', () => {
  const u = toastUndo; toastUndo = null;
  $('toast').classList.remove('show');
  if (u) u();
});

document.addEventListener('click', (e) => {
  const mode = e.target.closest('.modes [data-mode]');
  if (mode) { state.mode = mode.dataset.mode; render(); window.scrollTo(0, 0); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab[state.mode] = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const card = el.closest('.card');
  const id = card && card.dataset.id ? card.dataset.id : $('sheetBody').dataset.id;
  const sid = el.dataset.sid || (card && card.dataset.sid) || $('sheetBody').dataset.sid;
  const cid = (card && card.dataset.cid) || $('sheetBody').dataset.cid;
  const item = state.items.find((i) => i.id === id);
  const sup = state.supplies.find((x) => x.id === sid);

  if (act === 'cfmYes') finishConfirm(true);
  else if (act === 'cfmNo') finishConfirm(false);
  else if (act === 'done') complete(id);
  else if (act === 'menu') openMenu(item);
  else if (act === 'edit') openForm(item);
  else if (act === 'doneFromMenu') { closeSheet(); complete(id); }
  else if (act === 'delete') { closeSheet(); remove(id); }
  else if (act === 'close') closeSheet();
  else if (act === 'setType') updateFormType(el.dataset.type, true);
  else if (act === 'setHow') {
    $('officeForm').dataset.how = el.dataset.how;
    document.querySelectorAll('[data-act="setHow"]').forEach((b) => b.setAttribute('aria-pressed', b === el));
    $('howContact').hidden = el.dataset.how !== 'contact';
  }
  else if (act === 'addTime' || act === 'addTime2') el.insertAdjacentHTML('beforebegin', timeItem('12:00'));
  else if (act === 'rmTime') el.closest('.time-item').remove();
  else if (act === 'saveSettings') saveSettings(el);
  else if (act === 'bought') bought(sid);
  else if (act === 'boughtFromMenu') { closeSheet(); bought(sid); }
  else if (act === 'supplyMenu') openSupplyMenu(sup);
  else if (act === 'supplyEdit') openSupplyForm(sup, 'edit');
  else if (act === 'supplyDelete') { closeSheet(); supplyDelete(sid); }
  else if (act === 'readd') openSupplyForm(sup, 'readd');
  else if (act === 'buyGroup') { state.buyGroup = el.dataset.g; render(); }
  else if (act === 'goBuy') { state.tab['個人'] = '個人購買'; state.buyGroup = '專案'; render(); window.scrollTo(0, 0); }
  else if (act === 'addBuy') { $('buyRows').insertAdjacentHTML('beforeend', buyRow(null)); const r = $('buyRows').lastElementChild; r.querySelector('.b-name').focus(); }
  else if (act === 'rmBuy') el.closest('.buy-row').remove();
  else if (act === 'contactOpen') openContact(contactOf(cid));
  else if (act === 'contactEdit') openContactForm(contactOf(cid));
  else if (act === 'contactDelete') { closeSheet(); contactDelete(cid); }
});

async function demoApi(action, p) {
  await new Promise((r) => setTimeout(r, 200));
  const D = demo;
  const fi = (arr, id) => arr.findIndex((x) => x.id === id);
  const take = (arr, bin, id) => { const i = fi(arr, id); if (i >= 0) { bin[id] = arr[i]; arr.splice(i, 1); } };
  const putBack = (arr, bin, id) => { if (bin[id]) { arr.push(bin[id]); delete bin[id]; } };
  let cid = p.contactId;
  if ((action === 'add' || action === 'update') && p.newContact) {
    cid = D.seq(); D.contacts.push({ id: cid, name: p.newContact.name, phone: p.newContact.phone, history: [] });
  }
  const syncBuys = (pid) => {
    if (!p.buys) return;
    const keep = p.buys.map((b) => b.id).filter(Boolean);
    D.supplies.filter((x) => x.projectId === pid && x.status === '缺' && keep.indexOf(x.id) < 0).forEach((x) => take(D.supplies, D.trash.supplies, x.id));
    p.buys.forEach((b) => {
      const s = b.id && D.supplies.find((x) => x.id === b.id);
      if (s) Object.assign(s, { name: b.name, qty: b.qty, store: b.store });
      else D.supplies.push({ id: D.seq(), scope: '個人', projectId: pid, name: b.name, qty: b.qty, store: b.store, status: '缺' });
    });
  };
  if (action === 'add') {
    const nid = D.seq();
    D.items.push({ id: nid, type: p.type, content: p.content, times: p.times || [], dt: p.type === '待辦' || p.type === '辦公' ? p.deadline : (p.dt || ''), created: todayStr(), contactId: cid || '' });
    if (p.type === '專案') syncBuys(nid);
  }
  if (action === 'update') {
    const it = D.items[fi(D.items, p.id)];
    it.content = p.content;
    if (p.times) it.times = p.times;
    if (p.deadline) it.dt = p.deadline;
    if (p.dt) it.dt = p.dt;
    if (it.type === '辦公') it.contactId = cid || '';
    if (it.type === '專案') syncBuys(it.id);
  }
  if (action === 'complete') {
    const it = D.items[fi(D.items, p.id)];
    const c = it && D.contacts.find((x) => x.id === it.contactId);
    if (c) { c.history.push({ date: todayStr(), todo: it.content, result: p.result || '', itemId: it.id }); }
    D.supplies.filter((x) => x.projectId === p.id && x.status === '缺').forEach((x) => { x.removedBy = p.id; take(D.supplies, D.trash.supplies, x.id); });
    take(D.items, D.trash.items, p.id);
  }
  if (action === 'delete') take(D.items, D.trash.items, p.id);
  if (action === 'restore') {
    const it = D.trash.items[p.id];
    const c = it && D.contacts.find((x) => x.id === it.contactId);
    if (c) c.history = c.history.filter((h) => h.itemId !== p.id);
    Object.keys(D.trash.supplies).forEach((sid) => { if (D.trash.supplies[sid].removedBy === p.id) { delete D.trash.supplies[sid].removedBy; putBack(D.supplies, D.trash.supplies, sid); } });
    putBack(D.items, D.trash.items, p.id);
  }
  if (action === 'setDefaults') {
    D.defaults[p.type] = p.times;
    if (p.applyAll) D.items.filter((i) => i.type === p.type).forEach((i) => { i.times = p.times.slice(); });
  }
  if (action === 'setSupplyTime') D.supplyTime = p.time;
  if (action === 'supplyNeed') {
    let s = p.id && D.supplies.find((x) => x.id === p.id);
    if (!s) { s = { id: D.seq(), name: p.name, scope: p.scope || '辦公室' }; D.supplies.push(s); }
    Object.assign(s, { qty: p.qty, store: p.store, status: '缺' });
    if (p.projectId !== undefined) s.projectId = p.projectId;
  }
  if (action === 'supplyUpdate') Object.assign(D.supplies[fi(D.supplies, p.id)], { name: p.name, qty: p.qty, store: p.store }, p.projectId !== undefined ? { projectId: p.projectId } : {});
  if (action === 'supplyBought') D.supplies[fi(D.supplies, p.id)].status = '買了';
  if (action === 'supplyDelete') take(D.supplies, D.trash.supplies, p.id);
  if (action === 'supplyUndelete') putBack(D.supplies, D.trash.supplies, p.id);
  if (action === 'contactAdd') D.contacts.push({ id: D.seq(), name: p.name, phone: p.phone, history: [] });
  if (action === 'contactUpdate') Object.assign(D.contacts[fi(D.contacts, p.id)], { name: p.name, phone: p.phone });
  if (action === 'contactDelete') take(D.contacts, D.trash.contacts, p.id);
  if (action === 'contactUndelete') putBack(D.contacts, D.trash.contacts, p.id);
  const copy = (x) => JSON.parse(JSON.stringify(x));
  return { items: copy(D.items), supplies: copy(D.supplies), contacts: copy(D.contacts), defaults: copy(D.defaults), supplyTime: D.supplyTime };
}
